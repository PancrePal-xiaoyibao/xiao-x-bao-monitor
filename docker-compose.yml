services:
  monitor:
    image: ghcr.io/pancrepal-xiaoyibao/xiao-x-bao-monitor:latest
    ports:
      - "8080:8080"
    environment:
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://host.docker.internal:4000}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_TIMEOUT=30s
      - HTTP_ADDR=:8080
      - APP_TIMEZONE=Asia/Shanghai
      - FRONTEND_DIST=/app/frontend/dist
      - DB_PATH=/app/data/monitor.db
      - PROVIDER_CONFIG_PATH=/app/config/provider-config.yaml
      - SCHEDULER_ENABLED=true
      - SCHEDULER_INTERVAL=10m
      - SYNC_LOOKBACK_DAYS=30
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - monitor-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  monitor-data:
